services:
  # ── API Web Service ──────────────────────────────────────────────────────────
  # Serves FastAPI endpoints only — NO embedded worker.
  # Free plan (512 MB) is sufficient for API-only workloads.
  - type: web
    name: telex-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: EMBEDDED_WORKER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER_DEFAULT
        value: gemini
      - key: NEXTAUTH_SECRET
        sync: false
      - key: WEB_APP_URL
        value: https://telex-web.vercel.app

  # ── Paid Dedicated Background Worker (Optional Scale-Up) ─────────────────────
  # When upgrading to a paid plan ($7/mo starter), uncomment this block and set
  # EMBEDDED_WORKER: "false" in the web service above for dedicated worker isolation.
