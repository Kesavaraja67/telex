services:
  # 1. FastAPI Web API Service
  - type: web
    name: telex-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER_DEFAULT
        value: gemini
      - key: NEXTAUTH_SECRET
        sync: false
      # Set this to the public HTTPS URL of telex-api (e.g. https://telex-api.onrender.com)
      # IMPORTANT: must be configured in the Render dashboard before deploying the frontend.
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # 2. Background Job Worker Daemon
  - type: worker
    name: telex-worker
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m jobs.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER_DEFAULT
        value: gemini
