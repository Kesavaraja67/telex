  #   name: telex-worker
  #   runtime: python
  #   plan: starter
  #   rootDir: apps/api
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python worker.py
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.11.11
