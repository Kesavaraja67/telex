name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: telex
          POSTGRES_PASSWORD: telex
          POSTGRES_DB: telex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://telex:telex@localhost:5432/telex_test
      ENVIRONMENT: development
      # Required by services/crypto.py — fail-closed if absent
      TELEX_ENCRYPTION_KEY: ${{ secrets.TELEX_ENCRYPTION_KEY || '' }}
      TELEX_TEST_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (Black)
        run: black --check .

      - name: Check linting (Ruff)
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests with coverage (>=80%)
        run: pytest -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Dependency audit (pip-audit)
        # Phase 9.4: fail CI on any detected vulnerability in Python deps
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Dependency audit (npm audit)
        # Phase 9.4: fail CI on high or critical npm vulnerabilities in production dependencies
        run: npm audit --audit-level=high --omit=dev

  security:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
