[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telex-core"
version = "0.1.0"
description = "Standalone automated dependency repair engine and AST code scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Telex Engineering", email = "engineering@telex.sh" },
]
dependencies = [
    "tree-sitter-languages>=1.10.0",
    "tree-sitter>=0.21.0,<0.22.0",
    "httpx>=0.27.0",
]

[project.scripts]
telex = "telex_core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",
    "B008",
    "B904",
]

